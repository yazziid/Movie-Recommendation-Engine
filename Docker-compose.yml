services:
  movie_app:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn Recommender_API:app --host 0.0.0.0 --port 8001 --reload
    depends_on: [movieRec_postgres]
    ports:
      - "8001:8001"
    volumes:
      - .:/MOVIEREC
    networks:
      - app_network

  streamlit_app:
      build: .
      command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0
      ports:
        - "8501:8501"
      volumes:
        - .:/MOVIEREC
      depends_on:
        - movieRec_postgres
        - movie_app
      networks:
      - app_network

  movieRec_postgres:
    container_name: movieRec_postgres
    image: postgres:16
    environment:
      POSTGRES_USER: db_user
      POSTGRES_PASSWORD: db_password
      POSTGRES_DB: movieRec
    ports:
      - "5402:5432"
    volumes:
      - movieRec_pg_data:/var/lib/postgresql/data
    restart: always
    networks:
      - app_network
  
  movieRec_pgadmin:
    container_name: movieRec_pgadmin
    image: dpage/pgadmin4:latest
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "5052:80"
    depends_on:
      - movieRec_postgres
    networks:
      - app_network
    
volumes:
  movieRec_pg_data:

networks:
  app_network:
    driver: bridge